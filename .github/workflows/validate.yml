name: Validate library

# Runs the library validator on every push and pull request.
# Warnings fail the check as well (--strict).

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate song library
        run: python scripts/validate.py --strict --info .
